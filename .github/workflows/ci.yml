name: extension-ci

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "bilibili-vocab-extension/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "bilibili-vocab-extension/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKDIR: bilibili-vocab-extension
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.9"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: ${{ env.WORKDIR }}/pnpm-lock.yaml


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: ${{ env.WORKDIR }}/pnpm-lock.yaml


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm run test

  test-ui:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: ${{ env.WORKDIR }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: UI Tests
        run: pnpm run test:ui

  continuous-optimization-inventory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Inventory Continuous Optimization Plan (report-only, non-gating)
        run: node scripts/run-continuous-optimization.js --report-only

      - name: Upload continuous optimization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-optimization-inventory-report
          path: ${{ env.WORKDIR }}/test-results/continuous-optimization
          if-no-files-found: warn

  build-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: ${{ env.WORKDIR }}/pnpm-lock.yaml


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Extension Bundle
        run: pnpm run build:extension

      - name: Pack Extension
        run: pnpm run pack

      - name: Check Extension Package
        run: pnpm run check:extension-package

      - name: Run extension zip smoke
        run: pnpm run test:zip-smoke:built

      - name: Upload overlay size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-size-report-linux
          path: ${{ env.WORKDIR }}/dist/overlay-size-report.json
          if-no-files-found: warn

      - name: Upload extension package
        if: ${{ always() && hashFiles('bilibili-vocab-extension/extension.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: extension-package-linux
          path: ${{ env.WORKDIR }}/extension.zip
          if-no-files-found: error

      - name: Upload extension package report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-package-report-linux
          path: ${{ env.WORKDIR }}/test-results/extension-package
          if-no-files-found: warn

  pack-windows-smoke:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: ${{ env.WORKDIR }}/pnpm-lock.yaml


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Extension Bundle
        run: pnpm run build:extension

      - name: Run extension browser smoke
        run: pnpm run test:extension-smoke:built

      - name: Pack Extension
        run: pnpm run pack

      - name: Check Extension Package
        run: pnpm run check:extension-package

      - name: Run extension zip smoke
        run: pnpm run test:zip-smoke:built

      - name: Upload overlay size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-size-report-windows
          path: ${{ env.WORKDIR }}/dist/overlay-size-report.json
          if-no-files-found: warn

      - name: Upload extension package
        if: ${{ always() && hashFiles('bilibili-vocab-extension/extension.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: extension-package-windows
          path: ${{ env.WORKDIR }}/extension.zip
          if-no-files-found: error

      - name: Upload extension package report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-package-report-windows
          path: ${{ env.WORKDIR }}/test-results/extension-package
          if-no-files-found: warn
